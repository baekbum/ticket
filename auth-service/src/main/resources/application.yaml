server:
  port: 8080

spring:
  profiles:
    default: local
  application:
    name: auth-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ticket
    username: postgres
    password: hsck2301
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6390
      database: 0
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: auth-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.bum.*"
        spring.json.value.default.type: dev.bum.common.kafka.user.UserDtoForEvent
    admin:
      properties:
        auto.create.topics.enable: false

token:
  secret: ticket-project-secret-value-is-made-by-random
  accessTokenValidityInMilliseconds: 1800000
  refreshTokenValidityInMilliseconds: 1209600000

topic:
  user:
    name: user-event
  audit:
    log:
      name: audit-log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka-dlt:
    slack:
      enabled: true
      webhook-url: ${SLACK_WEBHOOK_URL:}
      admin-dlq-url: "${APP_ADMIN_DLQ_URL:http://localhost/admin/?menu=kafkaDlq}"
