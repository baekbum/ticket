server:
  port: 8080

spring:
  data:
    redis:
      host: ${TOKEN_STATE_REDIS_HOST:refresh-redis}
      port: ${TOKEN_STATE_REDIS_PORT:6379}
      database: ${TOKEN_STATE_REDIS_DATABASE:0}
      password: ${TOKEN_STATE_REDIS_PASSWORD:}
  application:
    name: audit-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_AUDIT_GROUP_ID:audit-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    admin:
      properties:
        auto.create.topics.enable: false

token:
  secret: ${TOKEN_SECRET}

topic:
  login:
    log:
      name: ${TOPIC_LOGIN_LOG_NAME:login-log}
  audit:
    log:
      name: ${TOPIC_AUDIT_LOG_NAME:audit-log}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    login-log:
      group-id: ${KAFKA_LOGIN_LOG_GROUP_ID:audit-login-log-group}
  kafka-dlt:
    slack:
      enabled: ${APP_KAFKA_DLT_SLACK_ENABLED:true}
      webhook-url: ${SLACK_WEBHOOK_URL:}
      admin-dlq-url: "${APP_ADMIN_DLQ_URL:}"

# 모든 서비스는 AUTH의 Refresh Token과 같은 Redis/DB를 조회한다.
token-state:
  redis:
    host: ${TOKEN_STATE_REDIS_HOST:refresh-redis}
    port: ${TOKEN_STATE_REDIS_PORT:6379}
    database: ${TOKEN_STATE_REDIS_DATABASE:0}
    password: ${TOKEN_STATE_REDIS_PASSWORD:}
