server:
  port: 8084

spring:
  data:
    redis:
      host: ${TOKEN_STATE_REDIS_HOST:localhost}
      port: ${TOKEN_STATE_REDIS_PORT:6390}
      database: ${TOKEN_STATE_REDIS_DATABASE:0}
      password: ${TOKEN_STATE_REDIS_PASSWORD:}
  profiles:
    default: local
  application:
    name: audit-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ticket
    username: postgres
    password: hsck2301
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    admin:
      properties:
        auto.create.topics.enable: false

topic:
  login:
    log:
      name: login-log
  audit:
    log:
      name: audit-log

token:
  secret: ticket-project-secret-value-is-made-by-random

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    login-log:
      group-id: audit-login-log-group
  kafka-dlt:
    slack:
      enabled: true
      webhook-url: ${SLACK_WEBHOOK_URL:}
      admin-dlq-url: "${APP_ADMIN_DLQ_URL:http://localhost/admin/?menu=kafkaDlq}"
