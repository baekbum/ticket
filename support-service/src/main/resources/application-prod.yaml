server:
  port: 8080

spring:
  data:
    redis:
      host: ${TOKEN_STATE_REDIS_HOST:refresh-redis}
      port: ${TOKEN_STATE_REDIS_PORT:6379}
      database: ${TOKEN_STATE_REDIS_DATABASE:0}
      password: ${TOKEN_STATE_REDIS_PASSWORD:}
  application:
    name: support-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

token:
  secret: ${TOKEN_SECRET}

# 모든 서비스는 AUTH의 Refresh Token과 같은 Redis/DB를 조회한다.
token-state:
  redis:
    host: ${TOKEN_STATE_REDIS_HOST:refresh-redis}
    port: ${TOKEN_STATE_REDIS_PORT:6379}
    database: ${TOKEN_STATE_REDIS_DATABASE:0}
    password: ${TOKEN_STATE_REDIS_PASSWORD:}
