server:
  port: 8083

spring:
  reactor:
    # 스레드가 바뀌어도 관측 정보와 traceId를 이어서 전달한다.
    context-propagation: auto
  profiles:
    default: local
  application:
    name: queue-service
  data:
    redis:
      host: localhost
      port: 6390
      database: 2
      # 장애 시 Redis 명령이 요청을 오래 붙잡지 않도록 제한한다.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

token:
  secret: ticket-project-secret-value-is-made-by-random

app:
  queue:
    admission-size: 5
    max-sessions-per-user: 4
    active-token-ttl: 20m
    waiting-token-ttl: 1m
    cleanup-mode: reactive
    cleanup-fixed-delay-ms: 20000
    cleanup-scan-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
