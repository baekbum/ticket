server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: queue-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

token:
  secret: ${TOKEN_SECRET:ticket-project-secret-value-is-made-by-random}

app:
  queue:
    admission-size: ${APP_QUEUE_ADMISSION_SIZE:100}
    token-ttl: ${APP_QUEUE_TOKEN_TTL:20m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
