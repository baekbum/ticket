server:
  port: 8080

spring:
  application:
    name: queue-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

token:
  secret: ${TOKEN_SECRET}

app:
  queue:
    admission-size: ${APP_QUEUE_ADMISSION_SIZE:100}
    max-sessions-per-user: ${APP_QUEUE_MAX_SESSIONS_PER_USER:4}
    active-token-ttl: ${APP_QUEUE_ACTIVE_TOKEN_TTL:${APP_QUEUE_TOKEN_TTL:20m}}
    waiting-token-ttl: ${APP_QUEUE_WAITING_TOKEN_TTL:1m}
    cleanup-fixed-delay-ms: ${APP_QUEUE_CLEANUP_FIXED_DELAY_MS:20000}
    cleanup-scan-count: ${APP_QUEUE_CLEANUP_SCAN_COUNT:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# 모든 서비스는 AUTH의 Refresh Token과 같은 Redis/DB를 조회한다.
token-state:
  redis:
    host: ${TOKEN_STATE_REDIS_HOST:refresh-redis}
    port: ${TOKEN_STATE_REDIS_PORT:6379}
    database: ${TOKEN_STATE_REDIS_DATABASE:0}
    password: ${TOKEN_STATE_REDIS_PASSWORD:}
