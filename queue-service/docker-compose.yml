services:
  queue-service:
    build:
      context: ../
      dockerfile: queue-service/Dockerfile
    deploy:
      replicas: 1
    environment:
      - SPRING_DATA_REDIS_HOST=queue-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=prod
      - APP_QUEUE_ADMISSION_SIZE=100
      - APP_QUEUE_ACTIVE_TOKEN_TTL=${APP_QUEUE_ACTIVE_TOKEN_TTL:-10m}
      - SPRING_DATA_REDIS_TIMEOUT=${SPRING_DATA_REDIS_TIMEOUT:-2s}
      - TOKEN_STATE_REDIS_HOST=${TOKEN_STATE_REDIS_HOST:-refresh-redis}
      - TOKEN_STATE_REDIS_PORT=${TOKEN_STATE_REDIS_PORT:-6379}
      - TOKEN_STATE_REDIS_DATABASE=${TOKEN_STATE_REDIS_DATABASE:-0}
      - TOKEN_STATE_REDIS_PASSWORD=${TOKEN_STATE_REDIS_PASSWORD:-}
      - TOKEN_STATE_REDIS_TIMEOUT=${TOKEN_STATE_REDIS_TIMEOUT:-2s}
      - TOKEN_SECRET=${TOKEN_SECRET:?TOKEN_SECRET must be set}
    networks:
      - ticket-network

networks:
  ticket-network:
    external: true
