spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    jdbc:
      batch_size: 500
      order_inserts: true
      order_updates: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    listener:
      auto-startup: false
