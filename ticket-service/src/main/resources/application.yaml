server:
  port: 8082
  servlet:
    context-path: /ticket

spring:
  profiles:
    default: local
  application:
    name: ticket-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ticket
    username: postgres
    password: hsck2301
  jpa:
    hibernate:
      ddl-auto: update
      jdbc:
        batch_size: 500
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: localhost
      port: 6380
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ticket-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.bum.*"
    admin:
      properties:
        auto.create.topics.enable: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 9000
            loggerLevel: basic
          queue-service-client:
            connectTimeout: 1500
            readTimeout: 3000
            loggerLevel: basic

token:
  secret: ticket-project-secret-value-is-made-by-random

topic:
  payment:
    completed:
      name: payment-completed
    virtual-account:
      expired:
        name: virtual-account-expired
        group-id: ticket-virtual-account-expire-group
  audit:
    log:
      name: audit-log

app:
  internal:
    service-token: ${APP_INTERNAL_SERVICE_TOKEN:local-internal-service-token}
  upload:
    root: uploads
    public-url-prefix: /ticket/uploads
  queue:
    enabled: true
    base-url: http://localhost:8083/queue
  payment-gateway:
    base-url: http://localhost:8099/payment-gateway
  kafka-dlt:
    slack:
      enabled: true
      webhook-url: ${SLACK_WEBHOOK_URL:}
      admin-dlq-url: "${APP_ADMIN_DLQ_URL:http://localhost:8999/admin/api/v1/view/embed/kafkaDlq}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
