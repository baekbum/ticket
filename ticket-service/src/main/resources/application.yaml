server:
  port: 8082
  servlet:
    context-path: /ticket

spring:
  profiles:
    default: local
  application:
    name: ticket-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ticket
    username: postgres
    password: hsck2301
  jpa:
    hibernate:
      ddl-auto: update
      jdbc:
        batch_size: 500
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: localhost
      port: 6380
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.bum.*"
    admin:
      properties:
        auto.create.topics.enable: false

token:
  secret: ticket-project-secret-value-is-made-by-random

topic:
  payment:
    completed:
      name: payment-completed
  audit:
    log:
      name: audit-log

app:
  upload:
    root: uploads
    public-url-prefix: /ticket/uploads
  queue:
    enabled: true
    base-url: http://localhost:8083/queue
