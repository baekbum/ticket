server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ticket-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
      jdbc:
        batch_size: 500
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.bum.*"
    admin:
      properties:
        auto.create.topics.enable: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic
          queue-service-client:
            connectTimeout: 500
            readTimeout: 1000
            loggerLevel: basic

token:
  secret: ${TOKEN_SECRET:ticket-project-secret-value-is-made-by-random}

topic:
  payment:
    completed:
      name: ${TOPIC_PAYMENT_COMPLETED_NAME:payment-completed}
  audit:
    log:
      name: ${TOPIC_AUDIT_LOG_NAME:audit-log}

app:
  upload:
    root: ${APP_UPLOAD_ROOT:/app/uploads}
    public-url-prefix: ${APP_UPLOAD_PUBLIC_URL_PREFIX:/ticket/uploads}
  queue:
    enabled: ${APP_QUEUE_ENABLED:true}
    base-url: ${APP_QUEUE_BASE_URL:http://queue-service:8080}
  kafka-dlt:
    slack:
      enabled: ${APP_KAFKA_DLT_SLACK_ENABLED:true}
      webhook-url: ${SLACK_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
