token:
  secret: test-token-secret-value-that-is-long-enough-for-tests

app:
  checkout:
    signing-key: test-pg-checkout-signing-key-independent-from-user-jwt
  merchants:
    credentials:
      ticksy:
        - ${app.ticket.service-token}
  payment-provider:
    token: test-payment-provider-token
  ticket:
    base-url: http://localhost:8082
    service-token: test-internal-service-token
  virtual-account:
    expiration:
      cron: "*/5 * * * * *"
    expired-outbox-publisher:
      fixed-delay-ms: 1000
