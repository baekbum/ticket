server:
  port: 8099

spring:
  config:
    import: optional:file:./pg-checkout.properties,optional:file:./payment-gateway-service/pg-checkout.properties
  data:
    redis:
      host: ${TOKEN_STATE_REDIS_HOST:localhost}
      port: ${TOKEN_STATE_REDIS_PORT:6390}
      database: ${TOKEN_STATE_REDIS_DATABASE:0}
      password: ${TOKEN_STATE_REDIS_PASSWORD:}
  profiles:
    default: local
  application:
    name: payment-gateway-service
  cloud:
    openfeign:
      client:
        config:
          ticket-payment-client:
            connectTimeout: 3000
            readTimeout: 5000
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ticket
    username: postgres
    password: hsck2301
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

token:
  secret: ${TOKEN_SECRET:ticket-project-secret-value-is-made-by-random}

app:
  checkout:
    signing-key: ${APP_PG_CHECKOUT_SIGNING_KEY:}
  financial-simulation:
    base-url: ${APP_FINANCIAL_SIMULATION_BASE_URL:}
    token: ${APP_FINANCIAL_SIMULATION_TOKEN:}
    connect-timeout: 2s
    read-timeout: 15s
  merchants:
    notifications:
      encryption-key: ${APP_MERCHANT_NOTIFICATION_ENCRYPTION_KEY:${app.ticket.service-token}}
  payment-provider:
    token: ${APP_PAYMENT_PROVIDER_TOKEN:local-payment-provider-token}
  ticket:
    service-token: ${APP_INTERNAL_SERVICE_TOKEN:local-internal-service-token}
  virtual-account:
management:
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
