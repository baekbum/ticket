global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: local-auth-service
    metrics_path: /auth/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: local-user-service
    metrics_path: /user/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: local-ticket-service
    metrics_path: /ticket/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082

  - job_name: local-queue-service
    metrics_path: /queue/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8083

  - job_name: local-audit-service
    metrics_path: /audit/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8084

  - job_name: local-admin-service
    metrics_path: /admin/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8999

  - job_name: local-view-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:3000
