name: ticket-monitoring-local

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - local-postgres-exporter
      - refresh-redis-exporter
      - seat-redis-exporter
      - queue-redis-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_local_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    depends_on:
      - tempo
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: "no"

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_local_data:/var/tempo
    restart: "no"

  local-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    command:
      - --no-collector.stat_bgwriter
      - --collector.stat_checkpointer
    environment:
      - DATA_SOURCE_NAME=postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-hsck2301}@host.docker.internal:${LOCAL_POSTGRES_PORT:-5432}/${LOCAL_POSTGRES_DB:-msa}?sslmode=disable
    restart: "no"

  refresh-redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    command:
      - --redis.addr=redis://host.docker.internal:6379
    restart: "no"

  seat-redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    command:
      - --redis.addr=redis://host.docker.internal:6380
    restart: "no"

  queue-redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    command:
      - --redis.addr=redis://host.docker.internal:6381
    restart: "no"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles:
      - cadvisor
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: "no"

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - PROMETHEUS_URL=http://prometheus:9090
      - TEMPO_URL=http://tempo:3200
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - grafana_local_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: "no"

volumes:
  prometheus_local_data:
  grafana_local_data:
  tempo_local_data:
