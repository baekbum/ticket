        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Spring 서비스 메트릭 수집 실패
          description: Spring Boot 서비스가 내려갔거나 actuator/prometheus endpoint에 접근할 수 없습니다.
        labels:
          severity: critical
          service: spring
