        noDataState: OK
        execErrState: Alerting
        for: 3m
        annotations:
          summary: Queue 서비스 응답 지연 증가
          description: 최근 5분 기준 queue-service 평균 응답 시간이 1초를 초과했습니다. Redis 상태와 대기열 처리 로직을 확인하세요.
        labels:
          severity: warning
          service: queue

  - orgId: 1
