        for: 2m
        annotations:
          summary: 결제 API 실패 비율 증가
          description: 최근 5분 기준 결제 API의 4xx/5xx 비율이 20%를 초과했습니다. 결제 요청 검증, 중복 요청, 결제 승인 흐름을 확인하세요.
        labels:
