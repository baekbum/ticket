        noDataState: OK
        execErrState: Alerting
        for: 3m
        annotations:
          summary: Spring 서비스 평균 응답 지연 증가
          description: 최근 5분 기준 평균 응답 시간이 1.5초를 초과했습니다. 느린 API, DB 쿼리, 외부 호출을 확인하세요.
        labels:
          severity: warning
          service: spring

      - uid: queue_average_latency_high
        title: Queue Average Latency High
