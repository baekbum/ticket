              editorMode: code
              expr: (sum by (job) (rate(http_server_requests_seconds_sum{job=~"local-queue-service|queue-service"}[5m])) / sum by (job) (rate(http_server_requests_seconds_count{job=~"local-queue-service|queue-service"}[5m]))) > 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
