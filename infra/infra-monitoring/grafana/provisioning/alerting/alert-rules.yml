              expr: (sum by (application) (rate(http_server_requests_seconds_sum{group="application"}[5m])) / sum by (application) (rate(http_server_requests_seconds_count{group="application"}[5m]))) > 1.5
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
