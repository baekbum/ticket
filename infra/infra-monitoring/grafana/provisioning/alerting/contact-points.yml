apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-critical
    receivers:
      - uid: slack-critical
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: "[{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}"
          text: |
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Target:* {{ if .Labels.application }}{{ .Labels.application }}{{ else if .Labels.redis }}{{ .Labels.redis }}{{ else if .Labels.database }}{{ .Labels.database }}{{ else }}{{ .Labels.instance }}{{ end }}
            *Service:* {{ .Labels.service }}
            *Job:* {{ .Labels.job }}
            *Instance:* {{ .Labels.instance }}
            *Severity:* {{ .Labels.severity }}
            {{ if .Annotations.dashboard_url }}*Dashboard URL:* <{{ .Annotations.dashboard_url }}|관련 대시보드로 이동>{{ end }}
            {{ end }}
