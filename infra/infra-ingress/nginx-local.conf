server {
    listen 80;
    # TLS 적용 전에는 prior knowledge 방식의 HTTP/2(h2c)를 지원합니다.
    http2 on;
    proxy_http_version 1.1;
    server_name localhost;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 서비스 접두사를 제거한 뒤 호스트의 Spring Boot 서비스로 전달합니다.
    location /auth/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8080/;
    }

    location /user/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8081/;
    }

    location /ticket/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8082/;
    }

    location /queue/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8083/;
    }

    location /support/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8085/;
    }

    location /audit/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8084/;
    }

    # DLQ와 모니터링처럼 관리 서비스가 직접 처리하는 API입니다.
    location /admin-api/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8998/;
    }

    location /payment-gateway/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_pass http://host.docker.internal:8099/;
    }

    # 로컬 프론트엔드는 호스트의 Vite 개발 서버가 제공합니다.
    location /client/ {
        include /etc/nginx/proxy-headers.inc;
        rewrite ^/client/(.*)$ /$1 break;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://host.docker.internal:3000;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 로컬 관리자 화면은 호스트의 Vite 개발 서버가 제공합니다.
    location /admin/ {
        include /etc/nginx/proxy-headers.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://host.docker.internal:8999;
    }

    location / {
        include /etc/nginx/proxy-headers.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://host.docker.internal:3000;
    }
}
