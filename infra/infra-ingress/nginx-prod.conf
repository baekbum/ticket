server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 서비스 접두사를 제거한 뒤 Docker 네트워크의 Spring Boot 서비스로 전달합니다.
    location /auth/ {
        include /etc/nginx/proxy-headers.inc;
        set $auth_backend http://auth-service:8080;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $auth_backend;
    }

    location /user/ {
        include /etc/nginx/proxy-headers.inc;
        set $user_backend http://user-service:8080;
        rewrite ^/user/(.*)$ /$1 break;
        proxy_pass $user_backend;
    }

    location /ticket/ {
        include /etc/nginx/proxy-headers.inc;
        set $ticket_backend http://ticket-service:8080;
        rewrite ^/ticket/(.*)$ /$1 break;
        proxy_pass $ticket_backend;
    }

    location /queue/ {
        include /etc/nginx/proxy-headers.inc;
        set $queue_backend http://queue-service:8080;
        rewrite ^/queue/(.*)$ /$1 break;
        proxy_pass $queue_backend;
    }

    location /support/ {
        include /etc/nginx/proxy-headers.inc;
        set $support_backend http://support-service:8080;
        rewrite ^/support/(.*)$ /$1 break;
        proxy_pass $support_backend;
    }

    location /audit/ {
        include /etc/nginx/proxy-headers.inc;
        set $audit_backend http://audit-service:8080;
        rewrite ^/audit/(.*)$ /$1 break;
        proxy_pass $audit_backend;
    }

    # DLQ와 모니터링처럼 관리 서비스가 직접 처리하는 API입니다.
    location /admin-api/ {
        include /etc/nginx/proxy-headers.inc;
        set $admin_api_backend http://admin-service:8998;
        rewrite ^/admin-api/(.*)$ /$1 break;
        proxy_pass $admin_api_backend;
    }

    location /payment-gateway/ {
        include /etc/nginx/proxy-headers.inc;
        set $payment_backend http://payment-gateway-service:8099;
        rewrite ^/payment-gateway/(.*)$ /$1 break;
        proxy_pass $payment_backend;
    }

    location /client/ {
        rewrite ^/client/(.*)$ /$1 last;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
