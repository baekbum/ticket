services:
  ingress-nginx:
    image: nginx:latest
    container_name: ingress-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-headers.inc:/etc/nginx/proxy-headers.inc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
