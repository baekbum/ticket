<head>
  <meta charset="UTF-8">
</head>
<link rel="stylesheet" th:href="@{/css/notice/fragment-notice.css}">

<div class="notice-page">
  <div class="frag-header">
    <h2>공지사항</h2>
    <p class="sub-txt">고객에게 노출할 공지사항을 작성하고 게시 상태와 중요 공지를 관리합니다.</p>
  </div>

  <div class="notice-toolbar">
    <div class="notice-toolbar-left">
      <select id="notice-search-status" aria-label="게시 상태">
        <option value="">전체 상태</option>
        <option value="DRAFT">초안</option>
        <option value="PUBLISHED">게시</option>
        <option value="HIDDEN">숨김</option>
        <option value="ARCHIVED">보관</option>
      </select>
      <select id="notice-search-category" aria-label="공지 분류">
        <option value="">전체 분류</option>
        <option value="GENERAL">일반</option>
        <option value="SERVICE">서비스</option>
        <option value="EVENT">이벤트</option>
        <option value="MAINTENANCE">점검</option>
      </select>
      <input id="notice-search-keyword" type="search" placeholder="제목 또는 내용 검색"
             onkeydown="if(event.key === 'Enter') triggerNoticeSearch()">
      <button class="notice-btn" type="button" onclick="triggerNoticeSearch()">
        <i class="ti ti-search"></i>검색
      </button>
      <button class="notice-btn outline" type="button" onclick="resetNoticeSearch()">
        <i class="ti ti-refresh"></i>초기화
      </button>
    </div>
    <button class="notice-btn success" type="button" onclick="openNoticeModalForCreate()">
      <i class="ti ti-plus"></i>신규 공지 등록
    </button>
  </div>

  <div class="notice-table-wrap">
    <table class="notice-table">
      <colgroup>
        <col style="width:65px">
        <col style="width:85px">
        <col style="width:100px">
        <col style="width:110px">
        <col>
        <col style="width:130px">
        <col style="width:90px">
        <col style="width:170px">
        <col style="width:150px">
      </colgroup>
      <thead>
      <tr>
        <th>순서</th>
        <th>ID</th>
        <th>중요</th>
        <th>분류</th>
        <th>제목</th>
        <th>상태</th>
        <th>조회수</th>
        <th>게시 일시</th>
        <th class="actions">관리</th>
      </tr>
      </thead>
      <tbody id="notice-table-body"></tbody>
    </table>
  </div>

  <div th:replace="~{common/pagination :: pagination}"></div>
</div>

<div class="notice-modal" id="notice-modal" role="dialog" aria-modal="true" aria-labelledby="notice-modal-title">
  <div class="notice-modal-content">
    <div class="notice-modal-header">
      <div>
        <p class="notice-modal-title" id="notice-modal-title">공지사항 등록</p>
        <p class="notice-modal-subtitle" id="notice-modal-subtitle">공지 내용을 입력합니다.</p>
      </div>
      <button class="notice-icon-btn" type="button" onclick="closeNoticeModal()" aria-label="닫기">
        <i class="ti ti-x"></i>
      </button>
    </div>

    <input type="hidden" id="notice-modal-mode" value="CREATE">
    <input type="hidden" id="notice-target-id">

    <div class="notice-form-group notice-title-field">
      <label for="notice-title">제목</label>
      <input id="notice-title" type="text" maxlength="200" placeholder="공지 제목을 입력하세요">
    </div>

    <div class="notice-form-row notice-settings-row">
      <div class="notice-form-group">
        <label for="notice-status">게시 상태</label>
        <select id="notice-status">
          <option value="DRAFT">초안</option>
          <option value="PUBLISHED">게시</option>
          <option value="HIDDEN">숨김</option>
          <option value="ARCHIVED">보관</option>
        </select>
      </div>
      <div class="notice-form-group">
        <label for="notice-category">분류</label>
        <select id="notice-category">
          <option value="GENERAL">일반</option>
          <option value="SERVICE">서비스</option>
          <option value="EVENT">이벤트</option>
          <option value="MAINTENANCE">점검</option>
        </select>
      </div>
      <div class="notice-form-group notice-pinned-field">
        <span class="notice-field-label">중요 공지</span>
        <label class="notice-check" for="notice-pinned">
          <input id="notice-pinned" type="checkbox">
          <span>목록 상단에 우선 노출됩니다.</span>
        </label>
      </div>
    </div>

    <div class="notice-form-group">
      <label for="notice-content">내용</label>
      <textarea id="notice-content" rows="13" placeholder="공지 내용을 입력하세요"></textarea>
    </div>

    <div class="notice-meta" id="notice-meta" hidden>
      <span><i class="ti ti-user"></i>작성자 <strong id="notice-meta-author">-</strong></span>
      <span><i class="ti ti-eye"></i>조회 <strong id="notice-meta-views">0</strong></span>
      <span><i class="ti ti-calendar"></i>게시 <strong id="notice-meta-published">-</strong></span>
    </div>

    <div class="notice-modal-actions">
      <button class="notice-btn danger" id="notice-delete-btn" type="button" onclick="deleteCurrentNotice()" hidden>
        <i class="ti ti-archive"></i>보관
      </button>
      <span class="notice-action-spacer"></span>
      <button class="notice-btn outline" type="button" onclick="closeNoticeModal()">닫기</button>
      <button class="notice-btn outline" id="notice-edit-btn" type="button" onclick="switchNoticeModalToEdit()" hidden>
        <i class="ti ti-edit"></i>수정
      </button>
      <button class="notice-btn" id="notice-save-btn" type="button" onclick="submitNoticeForm()">
        <i class="ti ti-device-floppy"></i>저장
      </button>
    </div>
  </div>
</div>

<script th:src="@{/js/common/pagination.js}"></script>
<script th:src="@{/js/notice/fragment-notice.js}"></script>
