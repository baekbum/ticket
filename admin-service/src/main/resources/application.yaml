server:
  port: 8999
  servlet:
    context-path: /admin

spring:
  profiles:
    default: local
  application:
    name: admin-service
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

token:
  secret: ticket-project-secret-value-is-made-by-random

services:
  auth-service:
    url: "http://localhost:8080/auth"
  user-service:
    url: "http://localhost:8081/user"
  ticket-service:
    url: "http://localhost:8082/ticket"
  queue-service:
    url: "http://localhost:8083/queue"
  audit-service:
    url: "http://localhost:8084/audit"
