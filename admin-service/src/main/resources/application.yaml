server:
  port: 8999
  servlet:
    context-path: /admin

spring:
  profiles:
    default: local
  application:
    name: admin-service
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

token:
  secret: ticket-project-secret-value-is-made-by-random

services:
  auth-service:
    url: "http://localhost:8080/auth"
  user-service:
    url: "http://localhost:8081/user"
  ticket-service:
    url: "http://localhost:8082/ticket"
  queue-service:
    url: "http://localhost:8083/queue"
  audit-service:
    url: "http://localhost:8084/audit"

app:
  monitoring:
    grafana-dashboard-url: "${APP_MONITORING_GRAFANA_DASHBOARD_URL:http://localhost:3001/d/ticket-spring-services/ticket-spring-services-overview?orgId=1&refresh=10s&kiosk}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
