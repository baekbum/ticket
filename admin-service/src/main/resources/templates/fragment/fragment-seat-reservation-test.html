<head>
  <meta charset="UTF-8">
</head>
<style>
.seat-test-frag {
  height: 100%;
  display: flex;
  flex-direction: column;
  color: var(--text-primary);
}
.seat-test-header {
  padding: 1.5rem 1.75rem 1rem;
  border-bottom: 1px solid var(--border);
}
.seat-test-header h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.seat-test-toolbar {
  display: flex;
  gap: 10px;
  align-items: end;
  padding: 1rem 1.75rem;
}
.seat-test-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 180px;
}
.seat-test-field label {
  color: var(--text-secondary);
  font-size: 11.5px;
  font-weight: 600;
}
.seat-test-field input {
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 10px;
  background: #fafafa;
  color: var(--text-primary);
  font: inherit;
}
.seat-test-btn {
  height: 36px;
  border: 0;
  border-radius: 8px;
  padding: 0 13px;
  background: var(--purple);
  color: #fff;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.seat-test-btn.secondary {
  background: var(--card-bg);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.seat-test-placeholder {
  margin: 0 1.75rem 1.5rem;
  flex: 1;
  min-height: 220px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  background: var(--card-bg);
}
.seat-test-popup {
  margin: 0 1.75rem 1.5rem;
  flex: 1;
  min-height: 0;
  display: none;
  background: transparent;
}
.seat-test-popup.is-open {
  display: flex;
}
.seat-test-window {
  width: 100%;
  height: 100%;
  min-height: 520px;
  margin: 0;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.seat-test-popup-header,
.seat-test-popup-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.seat-test-popup-header {
  justify-content: space-between;
}
.seat-test-popup-toolbar {
  justify-content: space-between;
}
.seat-test-toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.seat-test-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 20.5px;
}
.seat-test-popup-title {
  font-size: 14px;
  font-weight: 700;
}
.seat-test-stage {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
}
.seat-test-canvas {
  min-width: 0;
  min-height: 0;
  overflow: auto;
  background: #f7f8fb;
  padding: 18px;
}
.seat-test-side {
  border-left: 1px solid var(--border);
  padding: 14px;
  overflow: auto;
}
.seat-test-side h3 {
  font-size: 13px;
  margin-bottom: 10px;
}
.seat-test-svg-wrap svg {
  max-width: 100%;
  height: auto;
  display: block;
  background: #fff;
  border: 1px solid var(--border);
}
.seat-test-area {
  cursor: pointer;
  transition: opacity .12s, stroke-width .12s;
}
.seat-test-area:hover,
.seat-test-area.is-selected {
  stroke: #7c4dff !important;
  stroke-width: 3 !important;
  opacity: .88;
}
.seat-test-seat-svg {
  width: 100%;
  min-width: 700px;
  aspect-ratio: 700 / 520;
  display: block;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.seat-test-seat-available {
  fill: #2fbf71;
  stroke: rgba(20,16,40,0.22);
  stroke-width: 0.7;
  cursor: pointer;
}
.seat-test-seat-available:hover {
  fill: #20a862;
  stroke: var(--purple);
  stroke-width: 1.3;
}
.seat-test-seat-selected {
  fill: var(--purple);
  stroke: #3d27a8;
  stroke-width: 1.5;
  cursor: pointer;
}
.seat-test-seat-locked {
  fill: #f08c00;
  stroke: #b86600;
  stroke-width: 0.8;
  cursor: not-allowed;
}
.seat-test-seat-reserved {
  fill: var(--red);
  stroke: #8f2020;
  stroke-width: 0.8;
  cursor: not-allowed;
}
.seat-test-seat-label {
  fill: var(--text-muted);
  font-size: 12px;
}
.seat-test-selected-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 34px;
  margin-bottom: 12px;
}
.seat-test-chip {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 12px;
}
</style>

<div class="seat-test-frag">
  <div class="seat-test-header">
    <h2>좌석 선점 테스트</h2>
  </div>
  <section class="seat-test-toolbar">
    <div class="seat-test-field">
      <label for="seat-test-event-id">이벤트 ID</label>
      <input id="seat-test-event-id" type="number" min="1" placeholder="eventId">
    </div>
    <button class="seat-test-btn" type="button" onclick="openSeatReservationTestPopup()">테스트 대시보드 열기</button>
  </section>
  <div class="seat-test-placeholder" id="seat-test-empty">
    이벤트 ID를 입력하고 테스트 대시보드를 열어 시작하세요.
  </div>

  <div class="seat-test-popup" id="seat-test-popup">
    <div class="seat-test-window">
      <div class="seat-test-popup-toolbar">
        <div class="seat-test-toolbar-left">
          <div class="seat-test-field">
            <label for="seat-test-user-id">User ID</label>
            <input id="seat-test-user-id" type="text" placeholder="ticketing userId">
          </div>
          <div class="seat-test-toolbar-actions">
            <button class="seat-test-btn secondary" type="button" onclick="refreshSeatTestAreas()">구역 새로고침</button>
            <button class="seat-test-btn secondary" type="button" onclick="refreshSeatTestSeats()">좌석 새로고침</button>
            <button class="seat-test-btn" type="button" onclick="occupySeatTestSelection()">좌석 선점</button>
            <button class="seat-test-btn secondary" type="button" onclick="releaseAllSeatTestLocks()">좌석 전체 선점 취소</button>
          </div>
        </div>
        <button class="seat-test-btn secondary" type="button" onclick="closeSeatReservationTestPopup()">닫기</button>
      </div>
      <div class="seat-test-stage">
        <div class="seat-test-canvas">
          <div class="seat-test-svg-wrap" id="seat-test-layout"></div>
          <svg class="seat-test-seat-svg" id="seat-test-seat-svg" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid meet" style="display:none;"></svg>
        </div>
        <aside class="seat-test-side">
          <h3>선택 정보</h3>
          <div class="seat-test-selected-list" id="seat-test-selected-list"></div>
          <div style="color:var(--text-secondary); font-size:12px; line-height:1.7;">
            <div>구역: <strong id="seat-test-area-label">-</strong></div>
            <div>좌석 수: <strong id="seat-test-count-label">0</strong></div>
          </div>
        </aside>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/redis/fragment-seat-reservation-test.js}"></script>
