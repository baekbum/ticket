server:
  port: 8999
  servlet:
    context-path: /admin

spring:
  application:
    name: admin-service

token:
  secret: ${TOKEN_SECRET:ticket-project-secret-value-is-made-by-random}

services:
  auth-service:
    url: "http://auth-service:8080"
  user-service:
    url: "http://user-service:8080"
  ticket-service:
    url: "http://ticket-service:8080"
  queue-service:
    url: "http://queue-service:8080"
  audit-service:
    url: "http://audit-service:8080"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
