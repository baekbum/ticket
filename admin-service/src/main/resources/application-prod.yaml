server:
  port: 8999
  servlet:
    context-path: /admin

spring:
  application:
    name: admin-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

token:
  secret: ${TOKEN_SECRET:ticket-project-secret-value-is-made-by-random}

services:
  auth-service:
    url: "http://auth-service:8080"
  user-service:
    url: "http://user-service:8080"
  ticket-service:
    url: "http://ticket-service:8080"
  queue-service:
    url: "http://queue-service:8080"
  audit-service:
    url: "http://audit-service:8080"

app:
  kafka-dlq:
    entries:
      - dlt-topic: ${TOPIC_USER_EVENT_NAME:user-event}.DLT
        target-topic: ${TOPIC_USER_EVENT_NAME:user-event}
      - dlt-topic: ${TOPIC_AUDIT_LOG_NAME:audit-log}.DLT
        target-topic: ${TOPIC_AUDIT_LOG_NAME:audit-log}
      - dlt-topic: ${TOPIC_PAYMENT_COMPLETED_NAME:payment-completed}.DLT
        target-topic: ${TOPIC_PAYMENT_COMPLETED_NAME:payment-completed}
  monitoring:
    prometheus-url: "${APP_MONITORING_PROMETHEUS_URL:http://prometheus:9090}"
    failure-metrics:
      thresholds:
        service_down_count:
          warning-threshold: 1
          critical-threshold: 1
        http_5xx_rate:
          warning-threshold: 1
          critical-threshold: 5
        http_p95_latency:
          warning-threshold: 1
          critical-threshold: 3
        feign_timeout_count:
          warning-threshold: 1
          critical-threshold: 5
        redis_command_error_count:
          warning-threshold: 1
          critical-threshold: 3
        queue_token_complete_failure_count:
          warning-threshold: 1
          critical-threshold: 3
        kafka_dlq_publish_count:
          warning-threshold: 1
          critical-threshold: 1
    grafana:
      dashboards:
        - icon: ti ti-leaf
          title: Spring Boot / JVM
          subtitle: SpringBoot APM Dashboard (12900), JVM Micrometer
          description: HTTP 요청, 응답 시간, 예외, CPU, 메모리, GC, 스레드를 확인합니다.
          url: "${APP_MONITORING_SPRING_BOOT_JVM_DASHBOARD_URL:http://localhost:3001/d/ticket-spring-services/ticket-spring-services-overview?orgId=1&refresh=10s&var-application=All&kiosk}"
        - icon: ti ti-database
          title: PostgreSQL
          subtitle: PostgreSQL Dashboard (9628)
          description: 커넥션, 트랜잭션, 쿼리 처리량, DB 리소스 상태를 확인합니다.
          url: "${APP_MONITORING_POSTGRESQL_DASHBOARD_URL:http://localhost:3001/d/ticket-postgresql-overview/ticket-postgresql-overview?orgId=1&refresh=10s&kiosk}"
        - icon: ti ti-database
          title: Redis
          subtitle: Redis Dashboard
          description: 메모리, 명령 처리량, 연결 수, 대기열/락 저장소 상태를 확인합니다.
          url: "${APP_MONITORING_REDIS_DASHBOARD_URL:http://localhost:3001/d/ticket-redis-overview/ticket-redis-overview?orgId=1&refresh=10s&kiosk}"
        - icon: ti ti-brand-docker
          title: Docker
          subtitle: Docker / cAdvisor Dashboard
          description: 컨테이너 CPU, 메모리, 네트워크, 파일시스템 사용량을 확인합니다.
          url: "${APP_MONITORING_DOCKER_DASHBOARD_URL:http://localhost:3001/d/ticket-docker-cadvisor-overview/ticket-docker-cadvisor-overview?orgId=1&refresh=10s&kiosk}"
        - icon: ti ti-world-www
          title: Nginx
          subtitle: Nginx Ingress Dashboard
          description: Ingress 요청량, 응답 코드, 지연 시간, 업스트림 상태를 확인합니다.
          url: "${APP_MONITORING_NGINX_DASHBOARD_URL:http://localhost:3001/dashboards?query=Nginx}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s,5s,10s
    tags:
      application: ${spring.application.name}
