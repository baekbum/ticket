server:
  port: 8999
  servlet:
    context-path: /admin

spring:
  application:
    name: admin-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

token:
  secret: ${TOKEN_SECRET:ticket-project-secret-value-is-made-by-random}

services:
  auth-service:
    url: "http://auth-service:8080"
  user-service:
    url: "http://user-service:8080"
  ticket-service:
    url: "http://ticket-service:8080"
  queue-service:
    url: "http://queue-service:8080"
  audit-service:
    url: "http://audit-service:8080"

app:
  kafka-dlq:
    entries:
      - dlt-topic: ${TOPIC_USER_EVENT_NAME:user-event}.DLT
        target-topic: ${TOPIC_USER_EVENT_NAME:user-event}
      - dlt-topic: ${TOPIC_AUDIT_LOG_NAME:audit-log}.DLT
        target-topic: ${TOPIC_AUDIT_LOG_NAME:audit-log}
      - dlt-topic: ${TOPIC_PAYMENT_COMPLETED_NAME:payment-completed}.DLT
        target-topic: ${TOPIC_PAYMENT_COMPLETED_NAME:payment-completed}
  monitoring:
    prometheus-url: "${APP_MONITORING_PROMETHEUS_URL:http://prometheus:9090}"
    failure-metrics:
      thresholds:
        service_down_count:
          warning-threshold: 1
          critical-threshold: 1
        http_5xx_rate:
          warning-threshold: 1
          critical-threshold: 5
        http_p95_latency:
          warning-threshold: 1
          critical-threshold: 3
        feign_timeout_count:
          warning-threshold: 1
          critical-threshold: 5
        redis_command_error_count:
          warning-threshold: 1
          critical-threshold: 3
        queue_token_complete_failure_count:
          warning-threshold: 1
          critical-threshold: 3
        kafka_dlq_publish_count:
          warning-threshold: 1
          critical-threshold: 1
    grafana-dashboard-url: "${APP_MONITORING_GRAFANA_DASHBOARD_URL:http://localhost:3001/d/ticket-spring-services/ticket-spring-services-overview?orgId=1&refresh=10s&kiosk}"
    dashboards:
      spring-boot-jvm-url: "${APP_MONITORING_SPRING_BOOT_JVM_DASHBOARD_URL:http://localhost:3001/d/ticket-spring-services/ticket-spring-services-overview?orgId=1&refresh=10s&var-application=All&kiosk}"
      postgresql-url: "${APP_MONITORING_POSTGRESQL_DASHBOARD_URL:http://localhost:3001/d/ticket-postgresql-overview/ticket-postgresql-overview?orgId=1&refresh=10s&kiosk}"
      redis-url: "${APP_MONITORING_REDIS_DASHBOARD_URL:http://localhost:3001/d/ticket-redis-overview/ticket-redis-overview?orgId=1&refresh=10s&kiosk}"
      docker-url: "${APP_MONITORING_DOCKER_DASHBOARD_URL:http://localhost:3001/d/ticket-docker-cadvisor-overview/ticket-docker-cadvisor-overview?orgId=1&refresh=10s&kiosk}"
      nginx-url: "${APP_MONITORING_NGINX_DASHBOARD_URL:http://localhost:3001/dashboards?query=Nginx}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s,5s,10s
    tags:
      application: ${spring.application.name}
